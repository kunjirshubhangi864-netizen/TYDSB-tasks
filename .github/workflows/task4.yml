name: Daily Cron Job - 8 AM

on:
  schedule:
    - cron: "0 8 * * *"

jobs:
  daily-job:
    runs-on: ubuntu-latest

    steps:
      - name: Job started message
        run: echo "Daily cron job started successfully!"

      - name: Display current date and time
        run: date

      - name: Completion message
        run: echo "Daily cron job completed successfully!"
        
